# 연금 Agent — Docker Compose
#
# ━━ 쓰는 법 ━━
#   1) cp .env.example .env  하고 CLOVA_API_KEY 를 채운다
#   2) 제공 문서를 ./data/corpus/ 에 넣는다
#   3) docker compose --profile tools run --rm smoke    ← ★ 건너뛰지 말 것
#   4) docker compose up -d --build
#   5) curl -s localhost/health | grep -E 'llm_mock|degradation'
#
# ━━ 3)을 건너뛰면 안 되는 이유 ━━
# 키가 잘못돼도 서버는 정상 기동하고 200 OK를 낸다. 각 계층이 LLM 실패를
# 예외 없이 삼키고 결정론적 경로로 내려앉기 때문이다(L1→규칙추출,
# L5'/L4-sub→템플릿). 그 답변은 HyperCLOVA X 생성물이 아니므로 절대 제약
# 위반인데, 겉으로는 아무 이상이 없어 보인다.
# smoke 는 키로 실제 1회 호출해 이 상태를 배포 **전에** 드러낸다.
# 5)의 degradation_total 이 0인지도 함께 확인할 것.
#
# ━━ 왜 코퍼스를 볼륨으로 두는가 ━━
# 이미지에 문서를 굽지 않는다. 문서를 추가·교체할 때 이미지를 다시 빌드할
# 필요가 없고, 이미지 크기도 커지지 않는다. 인덱스는 컨테이너가 뜰 때
# entrypoint가 만든다(이미 있으면 재사용).
#
# ━━ 키는 이미지에 들어가지 않는다 ━━
# .env 를 env_file 로 주입하므로 이미지·저장소 어디에도 키가 남지 않는다.
#
# ⚠️ 모든 서비스가 같은 이미지 태그(pension-agent:latest)를 만든다.
#    그래서 build 인자가 서비스마다 다르면, **마지막에 빌드된 것이 앞의 것을
#    덮어쓴다.** 실제로 사고가 났다 — eval 에만 WITH_EMBEDDING 인자가 없어서
#    `docker compose build agent embed eval` 이 torch 없는 이미지를 만들었고,
#    임베딩이 조용히 BM25 단독으로 축퇴했다.
#    → build 블록이 있는 서비스는 **전부 같은 args** 를 가져야 한다.
#      tests/test_compose_consistency.py 가 이를 검사한다.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 로컬 임베딩을 쓰려면 true. 이미지가 커지므로 기본은 false.
        #   WITH_EMBEDDING=true docker compose up -d --build
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    image: pension-agent:latest
    container_name: pension-agent
    restart: always

    # ★ CLOVA_API_KEY 는 여기(.env)에서만 읽는다 ★
    # required: false — .env가 없어도 기동은 되게 한다. 대신 entrypoint가
    # 키 없음을 크게 경고한다. (없다고 죽으면 원인을 알기 어려운 에러만 남는다)
    env_file:
      - path: .env
        required: false

    environment:
      # ★ 운영에서는 mock LLM으로 떨어지지 않는다 ★
      #
      # 기본값은 LLM_MODE=auto 인데, auto는 **키가 없으면 조용히 mock으로
      # 전환한다.** .env 마운트 실패·키 오타·키 만료 어느 쪽이든 서버는
      # 정상 기동하고 200 OK로 결정론적 템플릿 답변을 낸다. 그 답변은
      # HyperCLOVA X가 만든 것이 아니므로 절대 제약 #1 위반이고,
      # 평가는 단일 GET이라 되돌릴 수 없다.
      #
      # real 로 못박으면 mock 클라이언트가 아예 생성되지 않는다. 키가
      # 잘못됐으면 /answer 가 실패하므로 배포 직후 바로 드러난다.
      # (기동 자체를 막지는 않는다 — restart: always 라 오타 하나가
      #  재시작 루프 + 전면 장애가 되는 편이 더 나쁘다)
      #
      # ⚠️ 키가 살아 있어도 호출이 실패하면 각 계층이 결정론적 경로로
      #    내려앉는다. 그 횟수는 /health 의 llm_usage.degradations 로
      #    확인할 것 — 0이 아니면 그만큼 HCX 생성물이 아니다.
      LLM_MODE: "real"
      # 코퍼스가 비었을 때 mock 문서로 인덱스를 만들지 여부.
      # 운영에서는 반드시 false — true면 지어낸 문서로 답변하게 된다.
      ALLOW_MOCK_CORPUS: "false"
      # true 로 두면 기동할 때마다 인덱스를 다시 만든다.
      # 문서를 바꾼 뒤 한 번 켰다가 다시 false 로 되돌리는 식으로 쓴다.
      FORCE_REINDEX: "${FORCE_REINDEX:-false}"
      # 요청 하나에 쓸 수 있는 전체 시간(초). 각 LLM 단계는 남은 시간이
      # 자기 예산보다 적으면 **통째로 생략된다.**
      #
      # 240초 = 평가 측 타임아웃 300초 - 여유 60초.
      # 주최측 공지: "문항 당 응답 대기 시간(타임아웃)은 300초입니다.
      # 타임아웃 또는 5xx 오류 발생 시, 최대 2회를 재시도합니다."
      # 질의는 순차 1건씩 전송되며 동시 요청은 없다.
      #
      # ⚠️ 예전 값 55는 **상한을 60초로 잘못 알고** 잡은 것이다. 그 탓에
      #    REVISE 재생성·구제 재생성이 예산 부족으로 생략되는 일이 있었다 —
      #    감독이 반려한 답변을 고칠 기회를 스스로 잘라낸 셈이다.
      #
      # ⚠️ 상한과 같은 값(300)으로 두지 말 것. 이 예산은 게이트일 뿐
      #    중단 장치가 아니라서, 마지막 게이트가 아슬아슬하게 열리면
      #    그 단계가 통째로 상한 밖에서 끝난다.
      # ⚠️ 낮춘다고 응답이 그만큼 빨라지지도 않는다 — 이미 시작한
      #    호출은 끊지 않는다. 낮추면 단계가 생략될 뿐이다.
      #    응답 시간은 평가지표 7종에 없다. 300초 안에서는 빠른 것보다
      #    정확한 것이 낫다.
      #
      # 조정 근거는 think_trace 에서 본다: `L6_재생성_생략` /
      # `SubAgent_구제_생략` 줄에 남은 시간과 필요 예산이 함께 찍힌다.
      PIPELINE_BUDGET_SEC: "${PIPELINE_BUDGET_SEC:-240}"

    ports:
      # 평가 요청은 80으로 들어온다. 다른 포트를 쓰려면
      #   HOST_PORT=8080 docker compose up -d
      - "${HOST_PORT:-80}:8000"

    volumes:
      # 제공 문서 — 읽기 전용으로 마운트 (컨테이너가 원본을 건드리지 못하게)
      - ./data/corpus:/app/data/corpus:ro
      # 인덱스 — 호스트에 남겨 재시작 시 재사용하고, 내용도 직접 볼 수 있게
      - ./data/index:/app/data/index
      # 임베딩 모델 캐시 — 컨테이너를 지워도 다시 안 받도록 호스트에 둔다
      - ./data/models:/app/data/models
      # 법령 조문 — 읽기 전용. 없어도 기동은 되고 법령 근거 판정만 꺼진다.
      # crawler는 별도 도구 서비스(law)로 돌려 이 파일을 만든다.
      - ./data/law:/app/data/law:ro

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      # 무중단 운영 중 로그가 디스크를 채우지 않도록 상한을 둔다
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 일회성 도구들 (평상시엔 뜨지 않는다) ────────────────────
  # 실행: docker compose run --rm <이름>

  # 키가 실제로 통하는지 확인 — 서버를 띄우기 전에 이것부터
  smoke:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    env_file:
      - path: .env
        required: false
    entrypoint: []
    command: ["python", "-m", "app.llm.smoke_test"]

  # 넣은 문서가 실제로 몇 글자나 읽히는지 점검
  check:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    volumes:
      - ./data/corpus:/app/data/corpus:ro
    entrypoint: []
    command: ["python", "-m", "app.ingest.check_corpus"]

  # 법령 조문 수집 (법제처 OPEN API). 첫 실행은 --dry-run 필수 —
  #   docker compose run --rm law --oc <OC> --dry-run
  # 확인되면 저장(볼륨에 남아 agent가 다음 기동부터 읽는다):
  #   docker compose run --rm law --oc <OC>
  #
  # ⚠️ entrypoint를 고정해 둔다. command로 두면 `docker compose run law
  #    --oc X`의 "--oc X"가 command 전체를 덮어써 버려 파이썬 모듈 경로
  #    자체가 사라진다("--oc"를 실행파일로 찾다가 No such file or directory).
  #    entrypoint는 run으로 안 바뀌므로 뒤에 붙인 인자가 항상 그대로
  #    app.law.crawler 의 인자로 간다.
  law:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    volumes:
      - ./data/law:/app/data/law
    entrypoint: ["python", "-m", "app.law.crawler"]

  # 함정 규칙의 근거 조문 후보 제안 / 등재 확인 —
  #   docker compose run --rm law-anchors --propose
  #   docker compose run --rm law-anchors --verify
  law-anchors:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    volumes:
      - ./data/law:/app/data/law:ro
    entrypoint: ["python", "-m", "app.law.anchors"]

  # 청크 임베딩 생성. 인덱스를 만든 뒤 실행한다.
  # 기본(local 백엔드)은 배치 처리라 몇 분이면 끝난다. 다만 로컬 모델을 쓰려면
  # 이미지를 WITH_EMBEDDING=true 로 빌드해야 한다:
  #   WITH_EMBEDDING=true docker compose build embed agent
  # 중단해도 이어서 만든다.
  embed:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - ./data/index:/app/data/index
      - ./data/models:/app/data/models
    entrypoint: []
    command: ["python", "-m", "app.ingest.build_embeddings"]

  # 자체 평가셋 42문항 (실물 코퍼스에서 돌려야 의미가 있다)
  eval:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - ./data/index:/app/data/index
      - ./data/models:/app/data/models
    entrypoint: []
    command: ["python", "-m", "tests.eval_set"]

  # 인덱스만 다시 만들기 (서버 재시작 없이)
  reindex:
    profiles: ["tools"]
    image: pension-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_EMBEDDING: "${WITH_EMBEDDING:-false}"
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - ./data/index:/app/data/index
    entrypoint: []
    command: ["python", "-m", "app.ingest.build_index"]
